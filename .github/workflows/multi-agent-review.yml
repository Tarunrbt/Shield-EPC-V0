name: Multi-Agent Review Pipeline

on:
  workflow_dispatch:
    inputs:
      input_document:
        description: "Path to the document/artifact to review"
        required: true
        default: "docs/AI_AGENT_STANDARDS.md"

  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "docs/**"
      - "ARCHITECTURE.md"
      - "ROADMAP.md"
      - "ARCHITECTURE_REVIEW.md"

jobs:
  multi-agent-review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ai-agents/pipeline/requirements.txt ]; then
            pip install -r ai-agents/pipeline/requirements.txt
          else
            echo "::error::requirements.txt not found"
            exit 1
          fi

      - name: Debug Python paths
        run: |
          pwd
          ls -la
          find . -name "config.py"
          python -c "import os,sys; print('cwd=', os.getcwd()); print('sys.path=', sys.path)"

      - name: Stage 1 - Gemini preprocessing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python ai-agents/pipeline/gemini_preprocess.py \
            --input "${{ github.event.inputs.input_document || 'docs/AI_AGENT_STANDARDS.md' }}" \
            --output stage1_normalized.json

      - name: Stage 2 - Claude validation
        if: ${{ vars.VALIDATION_PROVIDER == 'claude' }}
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          python ai-agents/pipeline/claude_validate.py \
            --input stage1_normalized.json \
            --output stage2_validated.json

      - name: Stage 2 - Groq validation
        if: ${{ vars.VALIDATION_PROVIDER == 'groq' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python ai-agents/pipeline/groq_validate.py \
            --input stage1_normalized.json \
            --output stage2_validated.json

      - name: Stage 2 - DeepSeek validation
        if: ${{ vars.VALIDATION_PROVIDER == 'deepseek' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python ai-agents/pipeline/deepseek_validate.py \
            --input stage1_normalized.json \
            --output stage2_validated.json

      - name: Stage 3 - ChatGPT report generation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python ai-agents/pipeline/chatgpt_report.py \
            --input stage2_validated.json \
            --output-md Verification_Report.md \
            --output-json Verification_Report.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multi-agent-review-outputs
          path: |
            stage1_normalized.json
            stage2_validated.json
            Verification_Report.md
            Verification_Report.json
          if-no-files-found: warn

  human-review-required:
    needs: multi-agent-review
    runs-on: ubuntu-latest

    steps:
      - name: Human review reminder
        run: |
          echo "Pipeline completed."
          echo "Human review is required before approval or merge."
